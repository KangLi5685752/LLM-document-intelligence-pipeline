[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-document-intelligence-pipeline"
version = "0.1.0"
description = "An evaluated portfolio prototype for traceable document intelligence extraction."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "numpy>=1.26,<3",
    "openai==2.46.0",
    "pydantic-ai-slim[openai]==2.31.0",
    "pydantic>=2.12,<3",
    "pypdf>=6,<7",
    "python-pptx==1.0.2",
    "scikit-learn>=1.3,<2",
    "sentence-transformers>=3,<6",
]

[project.scripts]
audit-pdfs = "document_intelligence.audit.pdf_audit:main"
document-mcp-server = "document_intelligence.agentic.mcp_server:main"
ingest-corpus = "document_intelligence.ingestion.batch_cli:main"
ingest-document = "document_intelligence.ingestion.cli:main"
validate-public-gold = "document_intelligence.extraction.annotation_cli:main"
run-openai-synthetic-preflight = "document_intelligence.llm_extraction.openai_preflight_cli:main"
run-openai-development-execution = "document_intelligence.llm_extraction.openai_development_execution_cli:main"
run-openai-development-execution-v0-2 = "document_intelligence.llm_extraction.openai_development_execution_v0_2_cli:main"
run-openai-development-execution-v0-3 = "document_intelligence.llm_extraction.openai_development_execution_v0_3_cli:main"
extract-project-facts = "document_intelligence.portfolio.cli:main_extract"
search-project-facts = "document_intelligence.portfolio.cli:main_search"
rag-search = "document_intelligence.portfolio.cli:main_rag_search"
rag-query = "document_intelligence.portfolio.cli:main_rag_query"
evaluate-rag-retrieval = "document_intelligence.portfolio.cli:main_evaluate"
agent-query = "document_intelligence.agentic.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["document_intelligence*"]

[tool.setuptools.package-data]
"document_intelligence.llm_extraction" = ["prompts/*.txt"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
