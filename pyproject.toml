[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-document-intelligence-pipeline"
version = "0.1.0"
description = "An evaluated portfolio prototype for traceable document intelligence extraction."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai==2.46.0",
    "pydantic>=2.12,<3",
    "pypdf>=6,<7",
    "python-pptx==1.0.2",
]

[project.scripts]
audit-pdfs = "document_intelligence.audit.pdf_audit:main"
ingest-corpus = "document_intelligence.ingestion.batch_cli:main"
ingest-document = "document_intelligence.ingestion.cli:main"
validate-public-gold = "document_intelligence.extraction.annotation_cli:main"
run-openai-synthetic-preflight = "document_intelligence.llm_extraction.openai_preflight_cli:main"
run-openai-development-execution = "document_intelligence.llm_extraction.openai_development_execution_cli:main"
run-openai-development-execution-v0-2 = "document_intelligence.llm_extraction.openai_development_execution_v0_2_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["document_intelligence*"]

[tool.setuptools.package-data]
"document_intelligence.llm_extraction" = ["prompts/*.txt"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
